<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTIX // BLACKBOX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blackbox.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="topbar">
        <div class="topbar-left">
            <h1 class="logo">TACTIX // <span class="logo-accent">BLACKBOX</span></h1>
        </div>
        <div class="topbar-right">
            <nav class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
                    <i class="fas fa-home"></i> Lobby
                </a>
                <a href="{{ url_for('configure') }}" class="nav-link {% if request.endpoint == 'configure' %}active{% endif %}">
                    <i class="fas fa-cog"></i> Configure
                </a>
                <a href="{{ url_for('game') }}" class="nav-link {% if request.endpoint == 'game' %}active{% endif %}">
                    <i class="fas fa-gamepad"></i> Game
                </a>
                <a href="{{ url_for('stats') }}" class="nav-link {% if request.endpoint == 'stats' %}active{% endif %}">
                    <i class="fas fa-chart-bar"></i> Statistics
                </a>
            </nav>
        </div>
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
