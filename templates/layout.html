<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}TACTIX // BLACKBOX{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/blackbox.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <script defer src="{{ url_for('static', filename='js/ui.js') }}"></script>
</head>

<body class="bb-grid-bg bb-noise">
  <div class="bb-shell">
    <header class="bb-topbar">
      <div class="bb-topbar-inner">
        <div class="bb-brand">
          <div class="title">TACTIX<span class="slash"> //</span> BLACKBOX</div>
          <div class="muted">BLACKBOX INTERFACE</div>
        </div>

        <nav class="bb-nav">
          <a href="/configure">CONFIGURE</a>
          <a href="/game">GAME</a>
          <a href="/stats">STATS</a>
        </nav>
      </div>
    </header>

    <main class="bb-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="bb-topbar" style="position:static;border-top:1px solid rgba(160,200,255,.10);border-bottom:none;">
      <div class="bb-topbar-inner" style="opacity:.9;">
        <div class="bb-kicker">SYSTEM STATUS: <span class="bb-led">ONLINE</span></div>
        <div class="bb-kicker">BUILD: <span class="bb-led">NEON-UI v1</span></div>
      </div>
    </footer>

    {% block scripts %}{% endblock %}
  </div>
</body>
</html>
