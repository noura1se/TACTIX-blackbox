{% extends "layout.html" %}

{% block content %}
<div class="game-container">
    <div class="game-left">
        <div class="neon-card">
            <div class="neon-card-header">
                <h2>OPERATOR <span class="vs">VS</span> SYSTEM</h2>
            </div>
            <div class="neon-card-body">
                <div id="game-board" class="game-board">
                    <!-- Le plateau de jeu sera généré par JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <div class="game-right">
        <div class="neon-card">
            <div class="neon-card-header">
                <h2>BREACH CONTROLS</h2>
            </div>
            <div class="neon-card-body">
                <div class="button-group-vertical">
                    <button id="exploit-scan" class="neon-button primary">
                        <i class="fas fa-search"></i> EXPLOIT SCAN
                    </button>
                    <button id="firewall-lock" class="neon-button primary">
                        <i class="fas fa-shield-alt"></i> FIREWALL LOCK
                    </button>
                    <button id="reset-game" class="neon-button danger">
                        <i class="fas fa-redo"></i> RESET GRID
                    </button>
                    <button id="undo-move" class="neon-button ghost">
                        <i class="fas fa-undo"></i> UNDO MOVE
                    </button>
                </div>

                <div class="status-indicators">
                    <div class="status-item">
                        <span class="status-label">GREALL SPJECT</span>
                        <span class="status-value">ACTIVE</span>
                    </div>
                    <!-- Ajoutez d'autres indicateurs si nécessaire -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/game.js') }}"></script>
{% endblock %}
