{% extends "layout.html" %}

{% block content %}
<div class="configure-container">
    <div class="neon-card">
        <div class="neon-card-header">
            <h2>Configure protocol.</h2>
        </div>
        <div class="neon-card-body">
            <form id="configure-form">
                <div class="form-group">
                    <label class="form-label">GRID SIZE</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="grid_size" value="3" checked>
                            <span class="radio-custom"></span>
                            3 x 3
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="grid_size" value="4">
                            <span class="radio-custom"></span>
                            4 x 4
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="grid_size" value="5">
                            <span class="radio-custom"></span>
                            5 x 5
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">MODE</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="OPERATOR vs SYSTEM" checked>
                            <span class="radio-custom"></span>
                            OPERATOR vs SYSTEM
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="OPERATOR vs OPERATOR">
                            <span class="radio-custom"></span>
                            OPERATOR vs OPERATOR
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">DIFFICULTY</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="difficulty" value="EASY" checked>
                            <span class="radio-custom"></span>
                            EASY
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="difficulty" value="MEDIUM">
                            <span class="radio-custom"></span>
                            MEDIUM
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="difficulty" value="RELENTLESS">
                            <span class="radio-custom"></span>
                            RELENTLESS
                        </label>
                    </div>
                </div>

                <button type="submit" class="neon-button primary">
                    <i class="fas fa-bolt"></i> INITIATE BREACH
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/configure.js') }}"></script>
{% endblock %}
