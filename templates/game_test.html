<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Test</title>
    <style>
        body {
            background: #0a0a0f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 2rem;
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            max-width: 400px;
            margin: 2rem auto;
            background: #1a1a2e;
            padding: 2px;
        }
        
        .grid-cell {
            aspect-ratio: 1;
            background: #0a0a0f;
            border: 1px solid #00f6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            min-height: 100px;
        }
        
        .grid-cell:hover {
            background: rgba(0, 246, 255, 0.1);
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #00f6ff;">GAME TEST</h1>
    
    <div class="game-grid" id="test-grid">
        <div class="grid-cell">X</div>
        <div class="grid-cell"></div>
        <div class="grid-cell">O</div>
        <div class="grid-cell"></div>
        <div class="grid-cell">X</div>
        <div class="grid-cell"></div>
        <div class="grid-cell">O</div>
        <div class="grid-cell"></div>
        <div class="grid-cell"></div>
    </div>
    
    <script>
        console.log('Test page loaded');
        const grid = document.getElementById('test-grid');
        console.log('Grid found:', grid);
    </script>
</body>
</html>
